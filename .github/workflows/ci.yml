name: MercadoVerde CI

# Se ejecuta automáticamente en cada push o pull request a la rama main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── 1. Verificar que las dependencias se instalan correctamente ──
  build:
    name: Instalar dependencias
    runs-on: ubuntu-latest

    steps:
      # 1.1. Descarga el código del repositorio en la máquina virtual de GitHub.
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 1.2. Instala Python 3.13.
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 1.3. Instala las dependencias del 'requirements.txt'.
      - name: Instalar dependencias de requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1.4. Comprueba que app.py se puede importar sin errores.
      - name: Verificar app.py
        run: python -m py_compile app.py && echo "app.py sin errores"

  # ── 2. Linting: Comprueba el estilo y calidad del código ──
  lint:
    name: Análisis de código (Lint)
    runs-on: ubuntu-latest
    needs: build # Solo se ejecuta si 'build' ha pasado.

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar herramientas de análisis
        run: |
          pip install flake8

      # Comprueba errores graves de sintaxis y código muerto
      # No falla por estilo, solo por errores reales.
      - name: Ejecutar flake8 sobre app.py
        run: |
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics

  # ── 3. Tests de seguridad básicos sobre app.py ──
  security:
    name: Comprobaciones de seguridad
    runs-on: ubuntu-latest
    needs: build # Solo se ejecuta si 'build' ha pasado.

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar bandit (análisis de seguridad)
        run: pip install bandit

      # Bandit analiza el código Python en busca de vulnerabilidades conocidas.
      # -ll = solo reporta severidad media o alta (ignora las muy leves).
      - name: Ejecutar análisis de seguridad con bandit
        run: |
          bandit -r app.py -ll --exit-zero

  # ── 4. Verificar que Docker Build funciona ──
  docker:
    name: Build de imagen Docker
    runs-on: ubuntu-latest
    needs: [build, lint] # Solo se ejecuta si build y lint (la calidad del codigo) han pasado

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # Construye la imagen Docker para verificar que el Dockerfile es válido
      - name: Construir imagen Docker
        run: docker build -t mercadoverde-test .

      - name: Verificar que la imagen se ha creado
        run: docker images mercadoverde-test
