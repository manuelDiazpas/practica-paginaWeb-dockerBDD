<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MercadoVerde - Mi Lista de Compra</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Georgia", "Palatino", serif;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: linear-gradient(135deg, #2e7d32 0%, #388e3c 100%);
        color: #fff;
        padding: 20px;
        box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        position: relative;
      }

      .header-content {
        text-align: center;
      }

      header h1 {
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: 2px;
      }

      .leaf-icon {
        display: inline-block;
        font-size: 1.5rem;
        margin: 0 8px;
      }

      header p {
        font-size: 0.95rem;
        color: #c8e6c9;
        margin-top: 8px;
        font-style: italic;
      }

      .user-info {
        position: absolute;
        top: 20px;
        right: 20px;
        color: white;
        font-size: 1rem;
        background: rgba(255, 255, 255, 0.2);
        padding: 8px 15px;
        border-radius: 20px;
      }

      .admin-badge {
        background: #ffd54f;
        color: #1b5e20;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: bold;
        margin-left: 8px;
      }

      .logout-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 2px solid white;
        padding: 8px 20px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        font-weight: 500;
      }

      .logout-btn:hover {
        background: white;
        color: #2e7d32;
      }

      .admin-panel-btn {
        position: absolute;
        top: 60px;
        left: 20px;
        background: #ffd54f;
        color: #1b5e20;
        border: none;
        padding: 8px 20px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: bold;
        transition: all 0.3s ease;
        text-decoration: none;
        display: none;
      }

      .admin-panel-btn.show {
        display: inline-block;
      }

      .admin-panel-btn:hover {
        background: #ffee58;
        transform: translateY(-2px);
      }

      main {
        flex: 1;
        padding: 40px 20px;
      }

      .dashboard-container {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 8px 32px rgba(46, 125, 50, 0.2);
        max-width: 1400px;
        margin: 0 auto;
        border: 3px solid #66bb6a;
      }

      .welcome-section {
        text-align: center;
        padding: 30px;
        background: linear-gradient(135deg, #f1f8e9 0%, #dcedc8 100%);
        border: 2px solid #aed581;
        border-radius: 15px;
        margin-bottom: 30px;
      }

      .welcome-section h2 {
        color: #2e7d32;
        margin-bottom: 10px;
        font-size: 1.8rem;
        font-weight: 400;
      }

      .welcome-section p {
        color: #558b2f;
        font-size: 1.05rem;
      }

      .eco-badge {
        display: inline-block;
        background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
        color: #fff;
        padding: 10px 25px;
        border-radius: 20px;
        font-size: 0.9rem;
        margin-top: 15px;
        box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
      }

      .stats-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-box {
        background: linear-gradient(135deg, #f1f8e9 0%, #dcedc8 100%);
        padding: 30px;
        border: 2px solid #aed581;
        border-radius: 15px;
        text-align: center;
        transition: all 0.3s ease;
      }

      .stat-box:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3);
      }

      .stat-number {
        font-size: 2.8rem;
        font-weight: bold;
        color: #2e7d32;
      }

      .stat-label {
        color: #558b2f;
        font-size: 1rem;
        margin-top: 8px;
        font-style: italic;
      }

      .stat-icon {
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .filter-buttons {
        display: flex;
        gap: 12px;
        margin-bottom: 25px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .filter-btn {
        padding: 12px 25px;
        border: 2px solid #a5d6a7;
        background: white;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #2e7d32;
        font-size: 0.95rem;
        font-weight: 500;
      }

      .filter-btn.active {
        background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
        color: white;
        border-color: #4caf50;
        box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
      }

      .filter-btn:hover {
        background: #e8f5e9;
        transform: translateY(-2px);
      }

      .filter-btn.active:hover {
        background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }

      .product-card {
        background: white;
        border: 2px solid #a5d6a7;
        border-left: 6px solid #4caf50;
        border-radius: 15px;
        padding: 25px;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
      }

      .product-card:hover {
        box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3);
        transform: translateY(-3px);
      }

      .product-card.frutas {
        border-left-color: #ff6f00;
      }

      .product-card.verduras {
        border-left-color: #2e7d32;
      }

      .product-card.lacteos {
        border-left-color: #1976d2;
      }

      .product-card.carnes {
        border-left-color: #c62828;
      }

      .product-card.panaderia {
        border-left-color: #f57c00;
      }

      .product-card.despensa {
        border-left-color: #5d4037;
      }

      .product-card.bebidas {
        border-left-color: #0097a7;
      }

      .product-card.limpieza {
        border-left-color: #7b1fa2;
      }

      .eco-badge-card {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #4caf50;
        color: white;
        padding: 4px 10px;
        border-radius: 10px;
        font-size: 0.7rem;
        font-weight: bold;
      }

      .product-icon {
        font-size: 2.5rem;
        text-align: center;
        margin-bottom: 12px;
      }

      .product-name {
        font-size: 1.2rem;
        color: #2e7d32;
        margin-bottom: 8px;
        font-weight: 500;
        text-align: center;
      }

      .product-quantity {
        color: #558b2f;
        font-size: 0.9rem;
        text-align: center;
        margin-bottom: 10px;
      }

      .category-badge {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: bold;
        margin-top: 10px;
      }

      .category-badge.frutas {
        background: #ffe0b2;
        color: #e65100;
      }

      .category-badge.verduras {
        background: #c8e6c9;
        color: #1b5e20;
      }

      .category-badge.lacteos {
        background: #bbdefb;
        color: #0d47a1;
      }

      .category-badge.carnes {
        background: #ffcdd2;
        color: #b71c1c;
      }

      .category-badge.panaderia {
        background: #ffe0b2;
        color: #e65100;
      }

      .category-badge.despensa {
        background: #d7ccc8;
        color: #3e2723;
      }

      .category-badge.bebidas {
        background: #b2ebf2;
        color: #006064;
      }

      .category-badge.limpieza {
        background: #e1bee7;
        color: #4a148c;
      }

      .session-timer {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: white;
        border: 3px solid #66bb6a;
        padding: 18px 25px;
        border-radius: 20px;
        box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3);
        z-index: 1000;
        display: none;
      }

      .session-timer.show {
        display: block;
      }

      .session-timer.warning {
        border-color: #ff9800;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .timer-text {
        font-size: 0.9rem;
        color: #558b2f;
        margin-bottom: 8px;
      }

      .timer-countdown {
        font-size: 1.8rem;
        font-weight: bold;
        color: #2e7d32;
      }

      .timer-countdown.warning {
        color: #ff6f00;
      }

      footer {
        background: linear-gradient(135deg, #2e7d32 0%, #388e3c 100%);
        color: #c8e6c9;
        text-align: center;
        padding: 15px;
        font-size: 0.85rem;
      }

      .add-product-btn {
        position: fixed;
        bottom: 90px;
        right: 20px;
        background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
        color: white;
        border: none;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        font-size: 2rem;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        transition: all 0.3s ease;
        z-index: 999;
      }

      .add-product-btn:hover {
        transform: scale(1.1) rotate(90deg);
        box-shadow: 0 8px 25px rgba(76, 175, 80, 0.5);
      }
    </style>
  </head>
  <body>
    <header>
      <button class="logout-btn" onclick="location.href = '/logout'">
        🚪 Salir
      </button>
      <div class="header-content">
        <h1>
          <span class="leaf-icon">🌿</span>MercadoVerde<span class="leaf-icon"
            >🌿</span
          >
        </h1>
      </div>
      <div class="user-info">👤 <span>{{ session['username'] }}</span></div>
    </header>

    <main>
      <div class="dashboard-container">
        <div class="stats-container">
          <div class="stat-box">
            <div class="stat-number">{{ products|length }}</div>
            <div class="stat-label">En la lista</div>
          </div>
        </div>

        <div class="products-grid">
          {% for p in products %}
          <div class="product-card verduras">
            <div class="product-icon">📦</div>
            <div class="product-name">{{ p.nombreProducto }}</div>
            <div class="product-quantity">Cantidad: {{ p.cantidad }}</div>
            <div style="text-align: center">
              <span class="category-badge verduras">Pendiente</span>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </main>
  </body>
</html>
